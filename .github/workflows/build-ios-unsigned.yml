# 在 GitHub 的 macOS 机器上编译 DSHIOS（everettjf/dsh-ios）
# 产物：未签名 ipa —— 下载后用 Sideloadly + 免费 Apple ID 签名装进 iPhone/iPad。
#
# 这个 App 做的事：内嵌 iSH-ARM64（用户态 Linux 模拟器）→ 启动内置 Alpine →
# 里面跑 Node 22 + 原版 @deepseek-ai/dsh → 起 dsh web → WKWebView 显示官方 Web UI。
# 全程在手机上，不连电脑、不连服务器。
#
# 两个 job 并行：
#   pinned  → 用上游锁定的 dsh 版本（保证能编出来）
#   latest  → 升到官方最新 dsh（追求"和原版一模一样"）

name: build-dshios-unsigned

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        # Only the version this app actually ships. 0.1.0-rc.7 ("pinned") is the
        # repository's historical default, but the terminal bundle
        # (@brianynwu/dsh-tui) peers on dsh ^0.1.5-rc.1, so 0.1.5-rc.2 is the
        # coherent pairing -- and the pinned job also spent 10-20 minutes per run
        # stuck in guest phase 3 (npx fetching node-gyp over the emulator's
        # partly-unreachable network) for a build nothing here installs.
        #
        # 本副本的改动：一次构建两个变体（fail-fast: false，互不影响）：
        #   cli —— 终端 TUI 版（原工作流默认产物，已多次实测跑通）
        #   web —— 浏览器 Web UI 版（README 展示的正式界面；按 app/AppDSH.xcconfig
        #          头部注释给出的 xcodebuild 命令行覆盖方式构建）
        include:
          - tag: cli
            dsh: 0.1.5-rc.2
            variant: cli
          - tag: web
            dsh: 0.1.5-rc.2
            variant: web

    steps:
      - name: 拉代码
        uses: actions/checkout@v4
      - name: privacy guard (the security preset must never be tracked)
        run: sh scripts/privacy-guard.sh

      - name: 装构建工具
        run: |
          # lld: iSH 的 guest VDSO 要用 LLVM 的链接器
          # libarchive + pkg-config: tools/fakefsify 只有在 libarchive 找到时才编译
          #   （src: ish-arm64/tools/meson.build 第 24-39 行）
          brew install lld meson ninja libarchive pkg-config
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "lld: $(ld.lld --version | head -n 1)"
          echo "meson: $(meson --version)"
          echo "ninja: $(ninja --version)"
          echo "--- libarchive 可见性 ---"
          pkg-config --modversion libarchive || echo "pkg-config 看不到 libarchive"
          pkg-config --cflags --libs libarchive || true
          ls -d /opt/homebrew/opt/libarchive 2>/dev/null || true

      - name: 查工具链版本
        run: |
          xcodebuild -version
          ruby -v
          node -v
          npm -v

      - name: 补 ruby 的 xcodeproj（生成 Xcode 工程要用）
        run: |
          gem install xcodeproj --no-document || true
          gem list xcodeproj

      - name: 把 dsh 版本改成矩阵指定的那个（latest 用）
        if: matrix.dsh != 'pinned'
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          echo "目标 dsh 版本: ${DSH_VERSION}"
          node -e "const fs=require('fs');const p='rootfs/staging/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.dependencies['@deepseek-ai/dsh']=process.env.DSH_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('pinned ->',j.dependencies)"
          # No lockfile to keep in step: the staging install resolves from the
          # manifest with peer dependencies unenforced (see the note in
          # scripts/build-rootfs.sh for why the lockfile cannot be honoured).

      - name: 编译 iSH-ARM64 模拟器
        run: |
          make emulator
          echo "--- 产物检查 ---"
          ls -l ish-arm64/build-arm64-release/ish
          ls -l ish-arm64/build-arm64-release/tools/fakefsify
          ls -l ish-arm64/build-arm64-release/tools/unfakefsify || true

      - name: 构建 guest 根文件系统（Alpine + Node 22 + 原版 dsh）
        env:
          DSH_VERSION: ${{ matrix.dsh }}
          # 10-09 与上游 9-30 的失败均为 npm SIGABRT（疑似 V8 堆溢出：
          # 这棵"全 peer 互联"的依赖树由 --force 现解析，内存占用不可控）。
          # runner 有 7GB 内存，放宽 Node 堆上限。
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          if [ "$DSH_VERSION" = "pinned" ]; then unset DSH_VERSION; fi
          make rootfs
          ls -lh build/root.tar.gz

      - name: 生成 Xcode 工程
        run: |
          make project
          ls -1 DSH.xcodeproj

      - name: 编译 App（关闭签名，CLI/TUI 版）
        if: matrix.variant == 'cli'
        run: |
          set +e
          # The project builds the CLI app: a terminal running the guest's dsh
          # CLI, with no web server and no DSH web UI in the binary. See
          # app/AppDSH.xcconfig for how to build the browser surface instead.
          xcodebuild \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DSH_DEVELOPMENT_TEAM="" \
            > build/xcodebuild.log 2>&1
          CODE=$?
          set -e
          echo "xcodebuild exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "======== 错误行 ========"
            grep -nE 'error:|fatal error|BUILD FAILED|build commands failed|Undefined symbol' build/xcodebuild.log | head -n 120 || true
            echo "======== 后 150 行 ========"
            tail -n 150 build/xcodebuild.log
            exit "$CODE"
          fi
          tail -n 15 build/xcodebuild.log

      - name: 编译 App（关闭签名，Web UI 版）
        if: matrix.variant == 'web'
        run: |
          set +e
          # 浏览器版：按 app/AppDSH.xcconfig 头部注释的说明，把该文件原地切到浏览器面。
          # 注意：不能用 xcodebuild 命令行覆盖 GCC_PREPROCESSOR_DEFINITIONS——命令行设置
          # 会作用于本次调用构建的所有目标，包括 libarchive 子工程，剥掉它的
          # HAVE_CONFIG_H 后 archive_platform.h 会直接 #error（第一版 web 构建就是这么挂的）。
          sed -i '' \
            -e 's/^PRODUCT_NAME = DSHCLI$/PRODUCT_NAME = DSH/' \
            -e 's/^PRODUCT_BUNDLE_IDENTIFIER = .*\.dshcli$/PRODUCT_BUNDLE_IDENTIFIER = $(DSH_BUNDLE_ID_PREFIX).dsh/' \
            -e 's/^DSH_DISPLAY_NAME = .*$/DSH_DISPLAY_NAME = DSHIOS/' \
            -e 's/^GCC_PREPROCESSOR_DEFINITIONS = \$(inherited) DSH_APP=1 DSH_CLI_ONLY=1$/GCC_PREPROCESSOR_DEFINITIONS = $(inherited) DSH_APP=1/' \
            app/AppDSH.xcconfig
          echo "--- 切换后的关键行 ---"
          grep -E '^(PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|DSH_DISPLAY_NAME|GCC_PREPROCESSOR_DEFINITIONS) ' app/AppDSH.xcconfig
          xcodebuild \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DSH_DEVELOPMENT_TEAM="" \
            > build/xcodebuild.log 2>&1
          CODE=$?
          set -e
          echo "xcodebuild exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "======== 错误行 ========"
            grep -nE 'error:|fatal error|BUILD FAILED|build commands failed|Undefined symbol' build/xcodebuild.log | head -n 120 || true
            echo "======== 后 150 行 ========"
            tail -n 150 build/xcodebuild.log
            exit "$CODE"
          fi
          tail -n 15 build/xcodebuild.log

      - name: 打成一个未签名的 ipa
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          # 变量后面不要紧跟非 ASCII 字符，bash 会把多字节字符当成变量名的一部分
          # Name the app explicitly: a scheme build can also emit the UI-test
          # runner, and picking "the first .app" would package the wrong one.
          if [ "${{ matrix.variant }}" = "web" ]; then
            APP_NAME="DSH.app"
          else
            APP_NAME="DSHCLI.app"
          fi
          APP_PATH="build/dd/Build/Products/Release-iphoneos/${APP_NAME}"
          echo "app: $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "没找到 .app，把目录摊开："
            find build/dd/Build/Products -maxdepth 3 -name '*.app' || true
            exit 1
          fi
          rm -rf Payload "DSHIOS-${TAG}-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "DSHIOS-${TAG}-unsigned.ipa" Payload
          ls -lh "DSHIOS-${TAG}-unsigned.ipa"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DSHIOS-ipa-${{ matrix.tag }}
          path: DSHIOS-${{ matrix.tag }}-unsigned.ipa
          retention-days: 14
