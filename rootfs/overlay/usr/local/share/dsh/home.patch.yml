# Harness-home patch layer, applied to every profile (web, headless, …).
#
# The host bridge plugin exposes the DSH app's iOS capabilities as dsh tools.
# It registers nothing when DSH_HOST_BRIDGE_URL/_TOKEN are absent, so the same
# guest image still runs outside the app (CLI emulator, tests).
- insert:
    - id: host-bridge
      name: /usr/local/lib/dsh-plugins/dsh-host-bridge/index.js

# Workspace dependencies and Office authoring, served from the image's own
# payload at /usr/local/share/dsh/office-runtime (see scripts/build-rootfs.sh,
# which assembles it with scripts/build-office-payload.py).
#
# This is the stock pairing the upstream SDK application ships for the same
# payload (dsh-sdk-app/cordis.patch.yml), minus the env-var indirection: the
# payload lives at a fixed path in this image, so `source` is a literal. The
# tool resolves the payload in place -- nothing is copied into the harness home
# on first use -- and it only touches the disk when an agent actually calls
# load_workspace_dependencies.
#
# skill-office carries cli: false deliberately. The LibreOffice Kit component is
# the one piece of the upstream payload with no linux build (it ships win32,
# darwin, and a wasm build that needs JIT), so on this guest the skills are
# told "LibreOffice Kit is disabled in this deployment" and document -> PDF
# rendering stays unavailable. Word/Excel/PowerPoint authoring itself is plain
# python-docx/openpyxl/python-pptx and works.
- insert:
    - id: workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      config:
        source: /usr/local/share/dsh/office-runtime/primary-runtime

    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      config:
        assetRoot: /usr/local/share/dsh/office-runtime/office-skills
        cli: false

# Session telemetry is off at the row, not merely in config.
#
# dsh-base mounts `session-telemetry-otel` with mode FEEDBACK_ONLY and a
# DeepSeek-operated OTLP endpoint (harness-telemetry.deepseeksvc.com/v1/logs):
# it releases a session-log prefix -- context included -- only after an explicit
# feedback action, never on ordinary activity, and tags it with a random UUID
# from $DSH_HOME/.anonymous-user-id. This build ships no such channel at all.
#
# The launcher also exports DSH_TELEMETRY_DISABLED (=1), which makes the CLI
# itself generate this same disable patch (see resolveTelemetryPatch in
# apps/cli: any non-empty value disables, "a privacy switch prefers
# off-by-mistake over on-by-mistake"). Both are here on purpose: the row is the
# thing the loader honours, and config alone cannot disable a row.
- id: session-telemetry-otel
  disabled: true
